name: Deploy portfolio to S3

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET || 'shaon-chatterjee-portfolio-2026' }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install website requirements
        run: python -m pip install -r requirements.txt

      - name: Build website
        run: python build.py

      - name: Connect securely to AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static assets (long cache)
        run: |
          aws s3 sync dist/static/ s3://${S3_BUCKET}/static/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload HTML/content (no cache)
        run: |
          aws s3 sync dist/ s3://${S3_BUCKET}/ \
            --delete \
            --exclude "static/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache (optional)
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"